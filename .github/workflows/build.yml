name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6', '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PgameTargets=${{ matrix.minecraft }} clean build --console=plain "-Porg.gradle.java.installations.paths=${{ steps.java17.outputs.path }},${{ steps.java21.outputs.path }},${{ steps.java25.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-chat-history-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.minecraft }}
          path: |
            common/build/reports/tests/
            common/build/test-results/
            versions/${{ matrix.minecraft }}/build/reports/tests/
            versions/${{ matrix.minecraft }}/build/test-results/
