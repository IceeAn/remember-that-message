name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --console=plain "-Porg.gradle.java.installations.paths=${{ steps.java21.outputs.path }},${{ steps.java25.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-chat-history
          path: |
            build/libs/*.jar
            versions/1.21.1/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            versions/1.21.1/build/reports/tests/
            versions/1.21.1/build/test-results/
